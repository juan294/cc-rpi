name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.15"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.19.0"
      - name: Install verification prerequisites
        run: |
          python3 -m pip install --quiet PyYAML==6.0.3 coverage==7.16.0 uv==0.12.10
          command -v shellcheck
          node --version
          gh --version
          uv --version
      - name: Run complete local-equivalent verification
        run: bash scripts/verify-local.sh
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-verification
          path: .rpi/local/verification.json
          include-hidden-files: true
          if-no-files-found: error
